<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Master English with Easy Fluency in Chennai. Personalized coaching, AI practice, and a vibrant community for career and life success.">
    <meta name="author" content="Easy Fluency">

    <title>Easy Fluency - Master English, Master Your World!</title>

    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Chart.js for Dashboard (optional, include if you want graphs) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --royal-purple: #6A057F;
            --electric-teal: #00F5D4;
            --bright-magenta: #F72585;
            --off-white: #F8F9FA;
            --charcoal: #212529;
            --white: #FFFFFF;
            --light-gray: #DEE2E6; /* Added for borders/separators */

            --primary-font: 'Poppins', sans-serif;
            --secondary-font: 'Lato', sans-serif;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--secondary-font);
            background-color: var(--off-white);
            color: var(--charcoal);
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--primary-font);
            font-weight: 700;
            color: var(--royal-purple);
        }

        p { margin-bottom: 1rem; }
        a { text-decoration: none; color: var(--royal-purple); transition: color 0.3s ease; }
        a:hover { color: var(--bright-magenta); }

        .section-padding { padding: 100px 0; }
        .bg-gradient-purple-teal {
            background: linear-gradient(135deg, var(--royal-purple) 0%, var(--electric-teal) 100%);
            color: var(--white);
        }

        /* --- NAVBAR --- */
        .navbar { background-color: rgba(248, 249, 250, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0, 0, 0, 0.1); }
        .navbar-brand span { font-weight: 700; color: var(--royal-purple); }
        .navbar-nav { width: 100%; justify-content: flex-end; }
        .nav-link { color: var(--charcoal); font-weight: 600; padding: 8px 18px; margin: 0 5px; border-radius: 50px; transition: all 0.3s ease; }
        .nav-link:hover, .nav-link.active { color: var(--royal-purple); background-color: rgba(0, 245, 212, 0.2); }
        .btn-nav-primary { background-color: var(--royal-purple); color: var(--white); padding: 8px 20px; border-radius: 50px; font-weight: 600; margin-left: 15px; border: none; transition: all 0.3s ease; }
        .btn-nav-primary:hover { background-color: var(--bright-magenta); color: var(--white); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }


        /* --- HERO SECTION --- */
        @keyframes gradientAnimation { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .hero-section { background: linear-gradient(-45deg, #6a057f, #9d02a0, #00f5d4, #00b4d8); background-size: 400% 400%; animation: gradientAnimation 15s ease infinite; color: var(--white); padding: 120px 0; text-align: left; }
        .hero-section h1 { font-weight: 700; color: var(--white); font-size: 3.8rem; text-shadow: 2px 2px 8px rgba(0,0,0,0.3); transition: color 0.3s ease; line-height: 1.2; }
        .hero-section h1:hover { color: var(--electric-teal); }
        .hero-section p.lead { font-size: 1.3rem; }
        
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
        .hero-image { max-width: 100%; height: auto; animation: float 6s ease-in-out infinite; }

        .btn-hero-primary { background-color: var(--white); color: var(--royal-purple); padding: 12px 30px; border-radius: 50px; font-weight: 700; transition: all 0.3s ease; border: 2px solid var(--white); }
        .btn-hero-primary:hover { background-color: transparent; color: var(--white); transform: translateY(-3px); }
        .btn-hero-secondary { background-color: transparent; color: var(--white); border: 2px solid var(--electric-teal); padding: 12px 30px; border-radius: 50px; font-weight: 700; transition: all 0.3s ease; }
        .btn-hero-secondary:hover { background-color: var(--electric-teal); color: var(--royal-purple); transform: translateY(-3px); border-color: var(--electric-teal); }
        
        /* --- ABOUT MENTOR SECTION --- */
        .mentor-card { background: var(--white); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        .mentor-card img { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 5px solid var(--electric-teal); margin-bottom: 25px; transition: transform 0.4s ease; }
        .mentor-card img:hover { transform: scale(1.05); }
        .mentor-card h3 { color: var(--royal-purple); margin-bottom: 15px; }
        .mentor-card .tagline { font-family: var(--primary-font); font-style: italic; color: var(--bright-magenta); font-weight: 600; margin-bottom: 20px; }
        .mentor-card .achievements { list-style: none; padding: 0; text-align: left; margin-bottom: 25px; }
        .mentor-card .achievements li { margin-bottom: 10px; display: flex; align-items: flex-start; }
        .mentor-card .achievements li i { color: var(--electric-teal); margin-right: 10px; font-size: 1.2rem; margin-top: 3px; }
        .mentor-description p { text-align: justify; margin-bottom: 15px; }


        /* --- FLUENCY ASSESSMENT SECTION --- */
        .assessment-card { background: var(--white); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        .assessment-card .icon { font-size: 4rem; color: var(--royal-purple); margin-bottom: 20px; }
        .assessment-card h3 { color: var(--royal-purple); margin-bottom: 15px; }
        .assessment-card p { font-size: 1.1rem; color: var(--charcoal); }
        .btn-assessment { background-color: var(--bright-magenta); color: var(--white); padding: 12px 30px; border-radius: 50px; font-weight: 700; transition: all 0.3s ease; border: none; }
        .btn-assessment:hover { background-color: var(--royal-purple); transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.15); }

        /* --- INTERACTIVE COURSE CATALOG --- */
        .course-card {
            background: var(--white);
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--light-gray);
        }
        .course-card:hover { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(106, 5, 127, 0.1); }
        .course-card img { width: 100%; height: 200px; object-fit: cover; border-bottom: 1px solid var(--light-gray); }
        .course-card .card-body { padding: 25px; flex-grow: 1; display: flex; flex-direction: column; }
        .course-card .card-title { color: var(--royal-purple); font-size: 1.4rem; margin-bottom: 10px; }
        .course-card .course-meta { display: flex; justify-content: space-between; font-size: 0.9rem; color: #666; margin-bottom: 15px; }
        .course-card .course-meta span i { color: var(--electric-teal); margin-right: 5px; }
        .course-card .course-description { font-size: 0.95rem; color: var(--charcoal); margin-bottom: 20px; flex-grow: 1; }
        .course-card .btn-outline-primary {
            color: var(--royal-purple);
            border-color: var(--royal-purple);
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 600;
            align-self: flex-start;
            transition: all 0.3s ease;
        }
        .course-card .btn-outline-primary:hover {
            background-color: var(--royal-purple);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* --- REAL-LIFE PRACTICE & CAREER BENEFITS CARDS --- */
        .custom-card {
            background-size: cover;
            background-position: center;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            color: var(--white);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            height: 350px;
        }
        .custom-card:hover {
            transform: scale(1.03); /* Slightly reduced scale for smoother hover */
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        .custom-card .card-content {
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.1));
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px;
            transition: background 0.4s ease;
        }
        .custom-card:hover .card-content {
            background: linear-gradient(to top, rgba(106, 5, 127, 0.9), rgba(0,0,0,0.2));
        }
        .custom-card h5 {
            color: var(--white);
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        .custom-card p {
            color: var(--off-white);
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: opacity 0.4s ease, max-height 0.4s ease;
        }
        .custom-card:hover p {
            opacity: 1;
            max-height: 100px; /* Adjust as needed */
        }
        
        /* --- WHY CHOOSE US SECTION --- */
        .feature-card {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #eee;
            box-shadow: 0 5px 15px rgba(0,0,0,0.04);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
        }
        .feature-card:hover { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(106, 5, 127, 0.1); }
        .feature-card .icon { font-size: 3rem; color: var(--electric-teal); margin-bottom: 1rem; }

        /* --- FEEDBACK BY STUDENTS SECTION (Enhanced for Video) --- */
        .feedback-card-video {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            border-top: 5px solid var(--electric-teal);
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .feedback-card-video:hover { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
        .feedback-card-video video {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 1rem;
            border: 3px solid var(--electric-teal);
            object-fit: cover;
            height: 200px; /* Fixed height for consistency */
            background-color: black; /* Fallback for no video */
        }
        .feedback-card-video .quote { font-style: italic; color: var(--charcoal); flex-grow: 1; }
        .feedback-card-video .student-name { font-weight: 700; color: var(--royal-purple); margin-top: 1rem; }
        .feedback-card-text {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            border-top: 5px solid var(--bright-magenta); /* Differentiated border */
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .feedback-card-text:hover { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
        .feedback-card-text .quote { font-style: italic; color: var(--charcoal); flex-grow: 1; }
        .feedback-card-text .student-name { font-weight: 700; color: var(--royal-purple); margin-top: 1rem; }
        .feedback-card-text img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; border: 3px solid var(--bright-magenta); }

        /* --- STUDENT DASHBOARD SECTION (Conceptual) --- */
        .dashboard-section {
            background: linear-gradient(45deg, var(--off-white), var(--electric-teal)10%); /* Subtle gradient */
            border-top: 1px solid var(--light-gray);
        }
        .dashboard-widget {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            height: 100%;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--light-gray);
        }
        .dashboard-widget h4 { color: var(--royal-purple); margin-bottom: 20px; }
        .dashboard-widget .icon { font-size: 2.5rem; color: var(--bright-magenta); margin-bottom: 15px; }
        .dashboard-widget canvas { max-height: 200px; width: 100% !important; height: auto !important; } /* For Chart.js */
        .progress-bar-custom {
            height: 15px;
            border-radius: 50px;
            background-color: var(--light-gray);
            overflow: hidden;
        }
        .progress-bar-custom div {
            height: 100%;
            background: linear-gradient(to right, var(--electric-teal), var(--royal-purple));
            border-radius: 50px;
            transition: width 0.6s ease;
            text-align: right;
            padding-right: 5px;
            color: var(--white);
            font-size: 0.75rem;
            line-height: 15px;
        }

        /* --- AI FLUENCY BOT (Conceptual) --- */
        .aibot-card {
            background: var(--white);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            border: 1px solid var(--light-gray);
        }
        .aibot-card .icon { font-size: 4rem; color: var(--electric-teal); margin-bottom: 20px; }
        .aibot-card h3 { color: var(--royal-purple); margin-bottom: 15px; }
        .aibot-card p { font-size: 1.1rem; color: var(--charcoal); margin-bottom: 30px; }
        .btn-aibot { background-color: var(--royal-purple); color: var(--white); padding: 15px 40px; border-radius: 50px; font-weight: 700; font-size: 1.1rem; transition: all 0.3s ease; border: none; }
        .btn-aibot:hover { background-color: var(--bright-magenta); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.18); }
        .bot-interface {
            background-color: var(--off-white);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid var(--light-gray);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            display: none; /* Hidden by default */
        }
        .chat-area {
            height: 300px;
            overflow-y: auto;
            border: 1px solid var(--light-gray);
            background-color: var(--white);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-message {
            background-color: var(--electric-teal);
            color: var(--charcoal);
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .bot-message {
            background-color: var(--royal-purple);
            color: var(--white);
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
        .bot-feedback {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
            text-align: left;
        }
        .input-group-aibot .form-control { border-radius: 50px 0 0 50px; }
        .input-group-aibot .btn { border-radius: 0 50px 50px 0; background-color: var(--royal-purple); color: var(--white); }
        .input-group-aibot .btn:hover { background-color: var(--bright-magenta); }
        .recording-indicator { color: var(--bright-magenta); margin-left: 10px; font-weight: bold; display: none; }


        /* --- GAMIFICATION & COMMUNITY HUB (Conceptual) --- */
        .gamification-card, .community-card {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            height: 100%;
            border: 1px solid var(--light-gray);
            text-align: center;
        }
        .gamification-card .icon, .community-card .icon { font-size: 3.5rem; color: var(--bright-magenta); margin-bottom: 15px; }
        .gamification-card h4, .community-card h4 { color: var(--royal-purple); margin-bottom: 10px; }
        .badge-item { display: inline-block; margin: 5px; background-color: var(--electric-teal); color: var(--royal-purple); padding: 8px 15px; border-radius: 20px; font-weight: 600; font-size: 0.9em; }
        .leaderboard-list { list-style: none; padding: 0; margin-top: 20px; }
        .leaderboard-list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dotted var(--light-gray); }
        .leaderboard-list li:last-child { border-bottom: none; }
        .leaderboard-list li span:first-child { font-weight: 600; color: var(--royal-purple); }
        .leaderboard-list li span:last-child { color: var(--charcoal); font-weight: bold; }

        .community-card .btn {
            background-color: var(--royal-purple);
            color: var(--white);
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            margin-top: 20px;
        }
        .community-card .btn:hover { background-color: var(--bright-magenta); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }


        /* --- INNOVATIVE SEGMENTED CONTACT INFO (PROPERLY ALIGNED) --- */
        .contact-info-container { display: flex; flex-direction: column; gap: 1.25rem; }
        .info-block { background: var(--white); padding: 20px; border-radius: 12px; display: flex; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s ease, box-shadow 0.3s ease; border: 1px solid var(--light-gray); }
        .info-block:hover { transform: translateX(8px); box-shadow: 0 8px 25px rgba(106, 5, 127, 0.15); }
        .info-block .icon { font-size: 1.8rem; color: var(--electric-teal); margin-right: 20px; min-width: 40px; text-align: center; }
        .info-block .text-content { font-weight: 600; }
        .info-block a { color: var(--charcoal); text-decoration: none; }
        .info-block a:hover { color: var(--royal-purple); }

        /* --- INNOVATIVE QUOTE SLIDER CARD --- */
        .quote-slider-card {
            background: var(--white);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.07);
            overflow: hidden;
            text-align: center;
            border: 1px solid var(--light-gray);
        }
        .quote-slider-card .quotes-wrapper { overflow: hidden; }
        .quote-slider-card .quote-track { display: flex; width: 300%; transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1); }
        .quote-slider-card .quote { width: 33.333%; padding: 0 1rem; box-sizing: border-box; }
        .quote-slider-card .quote-text { font-family: var(--primary-font); font-size: 1.15rem; font-style: italic; font-weight: 600; color: var(--royal-purple); line-height: 1.6; min-height: 100px; display: flex; align-items: center; justify-content: center;}
        .quote-slider-card .quote-author { font-size: 1rem; color: var(--charcoal); margin-top: 1rem; font-weight: bold; }
        .quote-slider-card .quote-nav { margin-top: 1.5rem; display: flex; justify-content: center; gap: 15px; }
        .quote-slider-card .quote-nav label { width: 12px; height: 12px; border-radius: 50%; background: #ddd; cursor: pointer; transition: all 0.3s ease; }
        .quote-slider-card .quote-nav label:hover { background: var(--bright-magenta); }
        .quote-slider-card input[type="radio"] { display: none; }
        #q1:checked ~ .quote-nav label[for="q1"],
        #q2:checked ~ .quote-nav label[for="q2"],
        #q3:checked ~ .quote-nav label[for="q3"] { background: var(--electric-teal); transform: scale(1.2); }
        #q1:checked ~ .quotes-wrapper .quote-track { transform: translateX(0%); }
        #q2:checked ~ .quotes-wrapper .quote-track { transform: translateX(-33.333%); }
        #q3:checked ~ .quotes-wrapper .quote-track { transform: translateX(-66.666%); }

        /* --- SCROLL PROGRESS BUTTON --- */
        .progress-wrap {
            position: fixed;
            right: 30px;
            bottom: 30px;
            height: 46px;
            width: 46px;
            cursor: pointer;
            display: block;
            border-radius: 50px;
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(15px);
            transition: all 200ms linear;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .progress-wrap.active-progress {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* === NEW INNOVATIVE HOVER EFFECT === */
        .progress-wrap:hover {
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 8px 20px rgba(106, 5, 127, 0.2);
        }

        .progress-wrap::before {
            content: '\2191'; /* Up arrow character */
            position: absolute;
            left: 0;
            top: 0;
            height: 46px;
            width: 46px;
            background-color: var(--white);
            border-radius: 50%;
            line-height: 46px;
            text-align: center;
            font-size: 24px;
            color: var(--royal-purple);
            z-index
